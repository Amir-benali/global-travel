<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Secure Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://js.stripe.com/v3/"></script>

    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 500px; margin-top: 50px; }
        .card { padding: 20px; border-radius: 10px; }
        .error-message { color: red; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card shadow-sm">
        <h4 class="text-center">Payment Details</h4>
        <form id="payment-form">
            <!-- Billing Information -->
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" id="name" class="form-control" placeholder="John Doe" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="john.doe@example.com" required>
            </div>
            <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <input type="text" id="address" class="form-control" placeholder="123 Main St" required>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="city" class="form-label">City</label>
                    <input type="text" id="city" class="form-control" placeholder="New York" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="zip" class="form-label">ZIP Code</label>
                    <input type="text" id="zip" class="form-control" placeholder="10001" required>
                </div>
            </div>
            <div class="mb-3">
                <label for="country" class="form-label">Country</label>
                <select id="country" class="form-select" required>
                    <option value="US">United States</option>
                    <option value="CA">Canada</option>
                    <option value="GB">United Kingdom</option>
                    <option value="AU">Australia</option>
                </select>
            </div>

            <!-- Stripe Card Element -->
            <div class="mb-3">
                <label class="form-label">Card Details</label>
                <div id="card-element" class="form-control"></div>
                <div id="card-errors" class="error-message"></div>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="pay-button" class="btn btn-primary w-100">Pay Now</button>
        </form>
    </div>
</div>

<script>
    const stripe = Stripe("pk_test_51Mx6ArCw3zkipEiTlywuYG1lXdWjDpdDNk4xDyW883kDji6h5XPzYszY2hnDy4bhUtsCBFTHtZZoariMcVHsyhxB00yRh98OJn");  // Replace with your Stripe public key
    const elements = stripe.elements();
    const card = elements.create("card");
    card.mount("#card-element");

    document.getElementById("payment-form").addEventListener("submit", async function(event) {
        event.preventDefault();
        document.getElementById("pay-button").disabled = true;

        const billingDetails = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            address: {
                line1: document.getElementById("address").value,
                city: document.getElementById("city").value,
                postal_code: document.getElementById("zip").value,
                country: document.getElementById("country").value
            }
        };

        const { paymentMethod, error } = await stripe.createPaymentMethod({
            type: "card",
            card: card,
            billing_details: billingDetails
        });

        if (error) {
            document.getElementById("card-errors").textContent = error.message;
            document.getElementById("pay-button").disabled = false;
        } else {
            console.log("Sending payment method to JavaFX");
            window.javafxConnector.receivePaymentMethod(paymentMethod.id, JSON.stringify(billingDetails))
                .then(response => {
                    console.log("Received response from JavaFX: " + response);
                    if (response === "success") {
                        window.location.href = "success.html";
                    } else {
                        window.location.href = "rejected.html";
                    }
                });
        }
    });
</script>

</body>
</html>
